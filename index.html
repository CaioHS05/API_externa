<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <main>
        <h1>Buscar Pokemon</h1>

        <form id="formPoke">
            <input 
            type="text"
            id="idPoke"
            placeholder="Digite o ID"
            min="1"
            required>

            <button type="submit">Buscar</button>
        </form>

        <p id="msg"></p>

        <div id="resultado">
            <h2 id="nomePokemon"></h2>
            <img alt="Imagem do Pokemon" id="imgPoke">
            <audio src="" id="audioPoke"></audio>
            <button id="btnCry">Play Cry</button>
            <p id="basePoke"></p>
            <p id="typePoke"></p>
        </div>

    </main>
    
    <script src="main.js"></script>
</body>
</html>
